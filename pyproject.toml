[project]
name = "modelbench"
version = "0.1.0"
description = "LLM performance benchmark (TTFT / TPS / latency / reliability / prompt-caching) over the OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.46.0",
    "tiktoken>=0.9.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # CJK fullwidth punctuation is intentional in report text
    "E501",  # line length handled by formatter; CJK report strings run long
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelbench"]
